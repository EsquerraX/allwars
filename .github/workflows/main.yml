name: ALL WARS - Build Android 13 APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare web folder
        run: |
          mkdir -p www
          cp -r *.html manifest.json sw.js *.png *.webp www/ 2>/dev/null || true
          echo "Files in www:"
          ls -la www/

      - name: Clean Gradle cache (fix bcprov jar error)
        run: |
          rm -rf ~/.gradle/caches/jars-9
          rm -rf ~/.gradle/caches/modules-2/files-2.1/org.bouncycastle

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npx cap init ALLWARS com.allwars.game --web-dir=www
          npx cap add android
          npx cap copy android

      - name: Build APK Android 13
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --refresh-dependencies

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALL-WARS-Android13-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
